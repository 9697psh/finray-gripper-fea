<style>

  --accent: #5cc48a; --accent-ink: #0d1510; --accent-soft: #1f3a2a;

  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) 16px; display: grid; gap: 14px; align-content: start; }

<script>
(() => {
  // ---------- constants ----------
  const DAYS = [16, 17, 18, 19, 20];

  const STATUSES = ['예정', '진행', '완료', '막힘'];
  const CELL_CYCLE = ['', '계획', '진행', '완료', '예비'];

      <div class="panel nsbox"><b>로봇 번호</b><label class="row" style="display:flex;gap:6px;align-items:center;color:var(--fg)">${badge({ team: 'A' })} /robot<input id="nsA" value="${esc(ns.A || '')}" placeholder="예: 3" ${can ? '' : 'disabled'} aria-label="로봇 A 번호"></label>
        <label class="row" style="display:flex;gap:6px;align-items:center;color:var(--fg)">${badge({ team: 'B' })} /robot<input id="nsB" value="${esc(ns.B || '')}" placeholder="예: 4" ${can ? '' : 'disabled'} aria-label="로봇 B 번호"></label>
        <span class="small muted">공통 명령은 위쪽 팀 선택 기준(전체일 때는 A)으로 바뀝니다. 번호를 바꾸면 모든 팀원 화면에 반영됩니다.</span></div>
      <div class="partnav" role="group" aria-label="파트 선택"><button data-part="all" aria-pressed="${part === 'all'}">전체</button>${parts.map(pt => `<button data-part="${esc(pt)}" aria-pressed="${part === pt}">${esc(pt)}</button>`).join('')}</div>
      ${K.length ? used.map(pt => `<div class="group-title"><h3>${esc(pt)}</h3><span class="small muted">${K.filter(k => k.part === pt).length}개</span></div><div class="cards">${K.filter(k => k.part === pt).map(cmdCard).join('')}</div>`).join('')
        : `<div class="empty">${S.commands.length ? '조건에 맞는 명령어가 없습니다.' : '아직 등록한 명령어가 없습니다.'}</div>`}
    </section>`;
  }
  function cmdCard(k) {
    const can = db && !S.readOnly, tasks = (k.taskIds || []).map(id => byId(S.tasks, id)).filter(Boolean);
    const filled = fillNs(k.cmd, k.team);
    const usedBy = S.code.filter(c => c.cmdId === k.id);
    return `<article class="card cmd" id="cmd-${esc(k.id)}"><div class="cmdhead">${k.team === '공통' ? '<span class="tag">공통</span>' : badge({ team: k.team })}${k.terminal ? `<span class="tag">${esc(k.terminal)}</span>` : ''}<span class="pill ${vCls(k.verified)}">${esc(k.verified || '강의 자료')}</span>
      ${can ? `<span style="margin-left:auto" class="row"><button class="ghost small" data-edit-cmd="${esc(k.id)}">수정</button></span>` : ''}</div>
      <h3>${esc(k.title)}</h3>
      <pre><code>${esc(filled)}</code><button class="copy" data-copy-cmd="${esc(k.id)}">복사</button></pre>
      ${k.note ? `<div class="small">${esc(k.note)}</div>` : ''}
      ${usedBy.length ? `<div class="row small"><span class="muted">이 명령으로 실행하는 코드</span>${usedBy.map(c => `<button class="ghost small" data-goto-code="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>` : ''}
      <div class="row small muted">${k.source ? `<span>출처: ${esc(k.source)}</span>` : ''}${tasks.map(t => `<button class="ghost small" data-open="${esc(t.id)}">${badge(t)} ${esc(t.title.length > 18 ? t.title.slice(0, 18) + '…' : t.title)}</button>`).join('')}</div></article>`;
  }
  function cmdModal(existing) {
    const k = existing || { part: S.cmdPart && S.cmdPart !== 'all' ? S.cmdPart : PARTS_CMD[0], team: S.team === 'B' ? 'B' : S.team === 'A' ? 'A' : '공통', verified: '확인 필요', taskIds: [] };
    const selTask = (k.taskIds || [])[0] || '';
    modal(`<h2>${existing ? '명령어 수정' : '명령어 추가'}</h2><div class="formgrid">
      <label>파트<input name="part" list="partList" value="${esc(k.part || '')}" required><datalist id="partList">${PARTS_CMD.map(x => `<option value="${esc(x)}">`).join('')}</datalist></label>
      <label>팀<select name="team">${['공통', 'A', 'B'].map(x => `<option ${k.team === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="full">무엇을 하는 명령인가<input name="title" value="${esc(k.title || '')}" required placeholder="예: 섹터 순회 노드 실행"></label>
      <label class="full">명령어 (여러 줄 가능, 로봇 번호 자리는 &lt;n&gt;)<textarea name="cmd" class="code" rows="5" required>${esc(k.cmd || '')}</textarea></label>
      <label>터미널<input name="terminal" value="${esc(k.terminal || '')}" placeholder="예: TERM1, 로봇"></label>
      <label>확인 상태<select name="verified">${VERIFY.map(x => `<option ${k.verified === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label>순서<input name="order" type="number" value="${esc(k.order || (Math.max(0, ...S.commands.map(x => x.order || 0)) + 1))}"></label>
      <label>관련 작업<select name="taskId"><option value="">(없음)</option>${taskOptions(selTask)}</select></label>
      <label class="full">메모<input name="note" value="${esc(k.note || '')}" placeholder="예: 반드시 로컬라이제이션 다음에 실행"></label>
      <label class="full">출처<input name="source" value="${esc(k.source || '')}" placeholder="예: Day3 PDF, 팀 작성"></label>
      ${existing ? '<div class="full"><button type="button" class="ghost" data-del-cmd>이 명령어 삭제</button></div>' : ''}</div>`, async f => {
      const d = Object.fromEntries(new FormData(f).entries());
      if (!d.title.trim() || !d.cmd.trim()) { toast('설명과 명령어를 적어 주세요.'); return false; }
      const others = (k.taskIds || []).slice(1);
      const body = { part: d.part.trim() || '기타', team: d.team, title: d.title.trim(), cmd: d.cmd.replace(/\s+$/, ''), terminal: d.terminal, verified: d.verified, order: Number(d.order) || 0, taskIds: d.taskId ? [d.taskId, ...others.filter(x => x !== d.taskId)] : others, note: d.note, source: d.source };
      if (existing) return write(() => db.doc('commands/' + existing.id).update({ ...body, ...stamp() }), '명령어를 고쳤습니다.');
      return write(() => db.collection('commands').add({ ...body, author: S.me || null, createdAt: new Date().toISOString(), ...stamp() }), '명령어를 추가했습니다.');
    });
    if (existing) { const del = document.querySelector('.modal [data-del-cmd]'); del.addEventListener('click', async () => { if (del.dataset.confirm !== '1') { del.dataset.confirm = '1'; del.textContent = '한 번 더 누르면 삭제'; return; } const ok = await write(() => db.doc('commands/' + existing.id).delete(), '명령어를 삭제했습니다.'); if (ok) del.closest('form').parentElement.remove(); }); }
  }

  function vAttempts() {
    const f = S.filterAttempt || 'all';
    const A = S.attempts.filter(recTeamOk).filter(a => f === 'all' || a.result === f).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    return `<section class="grid" style="gap:12px"><div class="toolbar"><h2>시도 기록</h2><span class="small muted">어떤 코드를 썼고, 왜 실패했고, 무엇을 고쳐 기존 코드보다 나아졌는지</span>
      <span style="margin-left:auto" class="row"><select id="fAttempt" aria-label="결과 필터"><option value="all">전체</option>${['성공', '부분', '실패'].map(x => `<option ${f === x ? 'selected' : ''}>${x}</option>`).join('')}</select>${db && !S.readOnly ? '<button class="primary" data-act="newattempt">시도 기록</button>' : ''}</span></div>
      ${A.length ? `<div class="list">${A.map(attemptFull).join('')}</div>` : '<div class="empty">아직 기록이 없습니다. 코드를 실행해 볼 때마다 "시도 기록"으로 남겨 주세요. 실패한 시도가 발표에서 가장 좋은 근거가 됩니다.</div>'}</section>`;
  }
  function attemptFull(a) {
    const t = byId(S.tasks, a.taskId), r = byId(S.refs, a.refId), logs = S.logs.filter(l => l.attemptId === a.id);
    return `<article class="item"><header>${t ? badge(t) : ''}<b class="r-${esc(a.result)}">${esc(a.result || '')}</b><b>${esc(a.title || '(제목 없음)')}</b>${a.forDeck ? '<span class="tag">발표에 사용</span>' : ''}<span class="small muted">${esc(t ? t.title : '')} · ${esc(authorName(a.author))} · ${fmtTime(a.createdAt)}</span>
      <span style="margin-left:auto" class="row">${db && !S.readOnly ? `<button class="ghost" data-edit-attempt="${esc(a.id)}">수정</button>` : ''}</span></header>
      <dl class="kv">${r ? `<dt>참고한 코드</dt><dd class="path">${esc(r.path || r.title)}</dd>` : ''}${a.codePath ? `<dt>사용한 코드</dt><dd class="path">${esc(a.codePath)}</dd>` : ''}${a.reason ? `<dt>실패 원인</dt><dd>${esc(a.reason)}</dd>` : ''}${a.fix ? `<dt>수정 내용</dt><dd>${esc(a.fix)}</dd>` : ''}${a.improvement ? `<dt>강화된 점</dt><dd>${esc(a.improvement)}</dd>` : ''}${logs.length ? `<dt>실행 로그</dt><dd>${logs.length}건</dd>` : ''}</dl>
      ${(a.baseCode || a.newCode) ? `<details><summary class="small">기존 코드 대비 변경 보기</summary>${diffHtml(a.baseCode, a.newCode)}</details>` : ''}</article>`;
  }

  function vLogs() {
    const q = (S.logQuery || '').toLowerCase(), f = S.filterLog || 'all';
    const L = S.logs.filter(recTeamOk).filter(l => (f === 'all' || l.result === f) && (!q || (l.command + ' ' + l.output + ' ' + (l.note || '')).toLowerCase().includes(q))).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    return `<section class="grid" style="gap:12px"><div class="toolbar"><h2>실행 로그</h2><span class="small muted">터미널 출력을 붙여넣거나 .log/.txt 파일을 불러와 모아 둡니다</span>
      <span style="margin-left:auto" class="row"><input id="logQ" placeholder="로그 검색 (예: ABORTED, amcl)" value="${esc(S.logQuery || '')}" aria-label="로그 검색"><select id="fLog" aria-label="결과 필터"><option value="all">전체</option>${['성공', '실패'].map(x => `<option ${f === x ? 'selected' : ''}>${x}</option>`).join('')}</select>${db && !S.readOnly ? '<button class="primary" data-act="newlog">로그 추가</button>' : ''}</span></div>
      ${L.length ? `<div class="list">${L.map(logItem).join('')}</div>` : '<div class="empty">아직 모인 로그가 없습니다. 실행할 때 나온 터미널 출력을 붙여넣어 두면 실패 원인을 찾을 때와 발표 때 그대로 쓸 수 있습니다.</div>'}</section>`;
  }
  function logItem(l) {
    const t = byId(S.tasks, l.taskId), a = byId(S.attempts, l.attemptId);
    return `<article class="item"><header>${t ? badge(t) : ''}<b class="r-${esc(l.result)}">${esc(l.result || '')}</b><code>${esc(l.command || '(명령어 없음)')}</code><span class="small muted">${esc(t ? t.title : '')}${a ? ' · ' + esc(a.title) : ''} · ${esc(authorName(l.author))} · ${fmtTime(l.createdAt)}</span>${db && !S.readOnly ? `<span style="margin-left:auto"><button class="ghost" data-del-log="${esc(l.id)}">삭제</button></span>` : ''}</header>
      ${l.note ? `<div class="small">${esc(l.note)}</div>` : ''}<details ${S.openLog === l.id ? 'open' : ''}><summary class="small">출력 ${String(l.output || '').split('\n').length}줄</summary><pre>${esc(l.output || '')}</pre></details></article>`;
  }

  function vDeck() {
    const A = S.attempts.filter(a => a.forDeck && recTeamOk(a)).sort((a, b) => ((byId(S.tasks, a.taskId) || {}).order || 0) - ((byId(S.tasks, b.taskId) || {}).order || 0));
    const imgs = S.media.filter(recTeamOk);
    return `<section class="grid" style="gap:14px"><div class="toolbar"><h2>발표 자료</h2><span class="small muted">시도 기록에서 "발표에 사용"을 켠 항목이 문제 → 원인 → 수정 → 결과 순서로 모입니다</span>
      <span style="margin-left:auto" class="row"><button data-act="copydeck" ${A.length ? '' : 'disabled'}>발표 요약 복사</button>${downloads ? `<button data-act="savedeck" ${A.length ? '' : 'disabled'}>Markdown 저장</button>` : ''}${assets && db && !S.readOnly ? '<button class="primary" data-act="newmedia">스크린샷 올리기</button>' : ''}</span></div>
      <div class="panel grid" style="gap:8px"><h3>발표 흐름 (자동)</h3><ol class="small" style="margin:0;padding-left:18px;display:grid;gap:4px">
        <li>배경: 스마트팜 수확 노동 문제와 역할 분담 (로봇 A: 섹터 순회 · 사진 전송 · 탐지 결과 전달 / 로봇 B: 작업자 동행 · 개수 확인 · 집하장 운반)</li>
        <li>설계: 로봇 A·B 흐름도 ①~⑥, A·B 연동 메시지 (연동 ${S.interfaces.filter(l => l.status === '연동 확인').length}/${S.interfaces.length} 확인)</li>

        <li>테스트: 실행 로그와 결과 (주행, 비전 연동, B 연동, 배터리, 통합)</li>
        <li>정리: 완료 ${teamTasks().filter(t => t.status === '완료').length}/${teamTasks().length} 작업, 남은 과제</li></ol></div>
      ${A.length ? A.map(storyCard).join('') : '<div class="empty">아직 발표용으로 고른 시도가 없습니다. 시도 기록에서 "발표에 사용"을 켜면 여기에 사례가 쌓입니다.</div>'}
      <div class="panel grid" style="gap:10px"><h3>스크린샷 · 사진</h3>${imgs.length ? `<div class="thumbs">${imgs.map(m => `<figure><a href="${esc(m.url)}" target="_blank" rel="noopener"><img src="${esc(m.url)}" alt="${esc(m.title)}" loading="lazy"></a><figcaption><b>${esc(m.title)}</b><br><span class="muted">${esc((byId(S.tasks, m.taskId) || {}).title || '')}</span></figcaption></figure>`).join('')}</div>` : `<div class="empty">${assets ? 'RViz 화면, 맵, 터미널 캡처를 올려 두면 발표 때 바로 쓸 수 있습니다.' : '이 화면에서는 이미지 업로드를 쓸 수 없습니다(편집 권한 필요).'}</div>`}</div>
    </section>`;

  function storyCard(a) {

      ${r ? `<div class="step"><span>출발점</span><div><span class="path">${esc(r.path || r.title)}</span><div class="small muted">${esc(r.limits || '')}</div></div></div>` : ''}
      ${a.reason ? `<div class="step"><span>문제</span><div>${esc(a.reason)}</div></div>` : ''}
      ${a.fix ? `<div class="step"><span>수정</span><div>${esc(a.fix)}</div></div>` : ''}

      <div class="step"><span>결과</span><div class="r-${esc(a.result)}"><b>${esc(a.result)}</b> ${logs.length ? `<span class="small muted">· 로그 ${logs.length}건</span>` : ''}</div></div>
      ${(a.baseCode || a.newCode) ? `<details><summary class="small">코드 비교</summary>${diffHtml(a.baseCode, a.newCode)}</details>` : ''}</article>`;
  }
  function deckMarkdown() {
    const A = S.attempts.filter(a => a.forDeck && recTeamOk(a));
    let md = `# ${S.team === 'all' ? '수확 로봇 A·B' : '로봇 ' + S.team} 개발 기록\n\n완료 ${teamTasks().filter(t => t.status === '완료').length}/${teamTasks().length} 작업\n`;
    A.forEach(a => {
      const t = byId(S.tasks, a.taskId), r = byId(S.refs, a.refId);

      if (a.reason) md += `- 문제: ${a.reason}\n`;

      md += `- 결과: ${a.result}\n`;
    });
    return md;
  }

  // ---------- task sheet ----------
  function openTask(id) {

    const open = $('#layer .sheet'), act = document.activeElement;
    if (open && open.dataset.id === id && open.contains(act) && /INPUT|TEXTAREA|SELECT/.test(act.tagName)) return; // keep what the viewer is typing
    const refs = (t.refIds || []).map(r => byId(S.refs, r)).filter(Boolean);
    const atts = S.attempts.filter(a => a.taskId === id).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const logs = S.logs.filter(l => l.taskId === id).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const editable = db && !S.readOnly;
    const slots = Object.entries(t.slots || {}).filter(([, v]) => v).map(([k, v]) => `<span class="cell k-${esc(v)}" style="display:inline-grid;width:auto;padding:0 8px;cursor:default">${labelSlot(k)} · ${esc(v)}</span>`).join(' ');
    $('#layer').innerHTML = `<div class="sheet-bg" data-close="1"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t.title)}" data-id="${esc(t.id)}">

      ${editable ? `<input id="tTitle" value="${esc(t.title)}" aria-label="세부항목" style="font-size:17px;font-weight:700">` : `<h2>${esc(t.title)}</h2>`}
      <div class="formgrid">
        <label>진행 상황<select id="tStatus" ${editable ? '' : 'disabled'}>${STATUSES.map(s => `<option ${t.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        <label>담당자<input id="tOwner" value="${esc(t.owner || '')}" ${editable ? '' : 'disabled'}></label>
        <label class="full">완료 기준 · 메모<textarea id="tNote" ${editable ? '' : 'disabled'} placeholder="예: 4개 섹터 좌표에 3회 연속 도착">${esc(t.note || '')}</textarea></label>
      </div>
      ${editable ? `<div class="row"><button class="primary" data-save-task="${esc(t.id)}">저장</button><span class="small muted">${t.updatedAt ? `마지막 수정 ${fmtTime(t.updatedAt)} · ${esc(authorName(t.updatedBy))}` : ''}</span></div>` : ''}

      if (!d.title.trim()) { toast('이름을 적어 주세요.'); return false; }
      const url = /^https?:\/\//.test(d.url) ? d.url : '';
      return write(() => db.collection('refs').add({ title: d.title.trim(), kind: d.kind, url, path: url ? '' : d.url, use: d.use, limits: d.limits, order: 100 + S.refs.length, taskIds: [] }), '참고 자료를 추가했습니다.');
    });
  }
  function mediaModal() {
    const form = modal(`<h2>스크린샷 올리기</h2><div class="formgrid">
      <label class="full">이미지<input type="file" name="file" accept="image/*" required></label>
      <label>제목<input name="title" placeholder="예: SLAM으로 만든 온실 맵"></label>
      <label>작업<select name="taskId">${taskOptions()}</select></label></div>`, async f => {
      const file = f.file.files[0];
      if (!file) { toast('이미지를 골라 주세요.'); return false; }
      try {
        const up = await assets.upload(file);
        return write(() => db.collection('media').add({ assetId: up.id, url: up.url, title: f.title.value || file.name, taskId: f.taskId.value, author: S.me || null, createdAt: new Date().toISOString() }), '이미지를 올렸습니다.');
      } catch (e) { toast(e && e.code === 'too_large' ? '파일이 너무 큽니다(20MB 이하).' : '이미지를 올리지 못했습니다.'); return false; }
    });
  }

  // ---------- events ----------
  document.addEventListener('click', async e => {
    const nb = e.target.closest('[data-note]');
    if (nb) { await flushNote(); S.noteId = nb.dataset.note; render(true); return; }
    const td = e.target.closest('[data-todo-del]');
    if (td) { if (td.dataset.confirm !== '1') { td.dataset.confirm = '1'; td.textContent = '한 번 더'; setTimeout(() => { td.dataset.confirm = ''; td.textContent = '삭제'; }, 3000); return; } await write(() => db.doc('todos/' + td.dataset.todoDel).delete()); return; }
    const nd = e.target.closest('[data-note-del]');
    if (nd) { if (nd.dataset.confirm !== '1') { nd.dataset.confirm = '1'; nd.textContent = '한 번 더 누르면 삭제'; setTimeout(() => { nd.dataset.confirm = ''; nd.textContent = '노트 삭제'; }, 3000); return; } clearTimeout(noteTimer); noteDirty = null; await write(() => db.doc('notes/' + nd.dataset.noteDel).delete(), '노트를 삭제했습니다.'); S.noteId = null; render(true); return; }
    const cp = e.target.closest('[data-copy-cmd]');
    if (cp) { const k = byId(S.commands, cp.dataset.copyCmd); if (!k) return; const txt = fillNs(k.cmd, k.team); try { await navigator.clipboard.writeText(txt); cp.textContent = '복사됨'; setTimeout(() => { cp.textContent = '복사'; }, 1500); } catch (err) { const r = document.createRange(); r.selectNodeContents(cp.parentElement.querySelector('code')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('선택해 두었습니다. Ctrl+C로 복사하세요.'); } return; }
    const pb = e.target.closest('[data-part]');
    if (pb) { S.cmdPart = pb.dataset.part; render(true); return; }
    const ec = e.target.closest('[data-edit-cmd]');
    if (ec) { cmdModal(byId(S.commands, ec.dataset.editCmd)); return; }
    const gc = e.target.closest('[data-goto-cmd]');
    if (gc) {
      const kid = gc.dataset.gotoCmd; const k = byId(S.commands, kid); if (!k) return;
      if (k.team !== '공통' && S.team !== 'all' && S.team !== k.team) { S.team = 'all'; try { localStorage.setItem('team', 'all'); } catch (err) {} }
      S.cmdPart = 'all'; S.cmdQuery = '';
      if (location.hash !== '#cmds') { lastView = 'cmds'; location.hash = 'cmds'; } else render(true);
      setTimeout(() => { const n = document.getElementById('cmd-' + kid); if (n) { n.scrollIntoView({ block: 'center', behavior: 'smooth' }); n.classList.add('flash'); } }, 120);
      return;
    }
    const go = e.target.closest('[data-goto-code]');
    if (go) {
      const cid = go.dataset.gotoCode; const c = byId(S.code, cid); if (!c) return;
      const t = byId(S.tasks, c.taskId); if (t && !inTeam(t)) { S.team = 'all'; try { localStorage.setItem('team', 'all'); } catch (err) {} }
      S.codeTask = 'all'; S.codeQuery = '';
      if (location.hash !== '#code') { lastView = 'code'; location.hash = 'code'; } else render(true);
      setTimeout(() => { const n = document.getElementById('code-' + cid); if (n) { n.scrollIntoView({ block: 'center', behavior: 'smooth' }); n.classList.add('flash'); } }, 120);
      return;
    }
    const el = e.target.closest('[data-open],[data-close],[data-cell],[data-act],[data-save-task],[data-edit-attempt],[data-del-log],[data-edit-code],[data-del-code]');
    if (!el) return;
    if (el.dataset.open) { lastView = view() === 'task' ? lastView : view(); location.hash = 'task-' + el.dataset.open; return; }
    if (el.dataset.close) { location.hash = lastView; return; }
    if (el.dataset.cell) {
      if (!db || S.readOnly) { toast('일정을 바꾸려면 저장 권한이 필요합니다.'); return; }
      const [id, k] = el.dataset.cell.split('|'); const t = byId(S.tasks, id); if (!t) return;
      const cur = (t.slots || {})[k] || ''; const nxt = CELL_CYCLE[(CELL_CYCLE.indexOf(cur) + 1) % CELL_CYCLE.length];
      const slots = { ...(t.slots || {}) }; if (nxt) slots[k] = nxt; else delete slots[k];
      await write(() => db.doc('tasks/' + id).update({ slots: slots, ...stamp() }));
      return;
    }
    if (el.dataset.saveTask) {
      const id = el.dataset.saveTask;
      await write(() => db.doc('tasks/' + id).update({ title: ($('#tTitle') ? $('#tTitle').value.trim() : '') || byId(S.tasks, id).title, status: $('#tStatus').value, owner: $('#tOwner').value, note: $('#tNote').value, ...stamp() }), '작업을 저장했습니다.');
      return;
    }
    if (el.dataset.editCode) { codeModal(null, byId(S.code, el.dataset.editCode)); return; }
    if (el.dataset.delCode) { if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = '한 번 더 누르면 삭제'; setTimeout(() => { el.dataset.confirm = ''; el.textContent = '삭제'; }, 3000); return; } await write(() => db.doc('code/' + el.dataset.delCode).delete(), '사용 코드를 삭제했습니다.'); return; }
    if (el.dataset.editAttempt) { attemptModal(null, byId(S.attempts, el.dataset.editAttempt)); return; }
    if (el.dataset.delLog) { if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = '한 번 더 누르면 삭제'; setTimeout(() => { el.dataset.confirm = ''; el.textContent = '삭제'; }, 3000); return; } await write(() => db.doc('logs/' + el.dataset.delLog).delete(), '로그를 삭제했습니다.'); return; }
    const act = el.dataset.act;
    if (act === 'newattempt') attemptModal(el.dataset.task || (view() === 'task' ? location.hash.slice(6) : null));
    if (act === 'newlog') logModal(el.dataset.task || null);
    if (act === 'newcmd') cmdModal(null);
    if (act === 'newnote') { await flushNote(); const ref = db.collection('notes').doc(); const ok = await write(() => ref.set({ title: '새 노트', body: '', team: S.team === 'all' ? '공통' : S.team, pinned: false, author: S.me || null, createdAt: new Date().toISOString(), ...stamp() })); if (ok) { S.noteId = ref.id; render(true); setTimeout(() => { const t = $('#noteTitle'); if (t) { t.focus(); t.select(); } }, 60); } }
    if (act === 'newcode') codeModal(el.dataset.task || (view() === 'task' ? location.hash.slice(6) : null));
    if (act === 'newtask') taskModal();
    if (act === 'newref') refModal();
    if (act === 'newmedia') mediaModal();
    if (act === 'copydeck') { const md = deckMarkdown(); try { await navigator.clipboard.writeText(md); toast('발표 요약을 복사했습니다.'); } catch (err) { modal(`<h2>발표 요약</h2><textarea class="code" rows="16" readonly>${esc(md)}</textarea>`, async () => true); } }
    if (act === 'savedeck') { try { await downloads.save({ filename: '로봇A_발표요약.md', data: deckMarkdown() }); } catch (err) { if (!err || err.code !== 'declined') toast('파일로 저장하지 못했습니다.'); } }
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('.seg button[data-team]'); if (!b) return;
    S.team = b.dataset.team; try { localStorage.setItem('team', S.team); } catch (err) {}
    render(true); sharePresence();
  });
  document.addEventListener('focusout', () => setTimeout(() => { if (S.pendingRender && !editingInApp()) render(); }, 0));
  document.addEventListener('change', async e => {
    const el = e.target;
    if (el.dataset.status) { await write(() => db.doc('tasks/' + el.dataset.status).update({ status: el.value, ...stamp() })); return; }
    if (el.dataset.owner) { await write(() => db.doc('tasks/' + el.dataset.owner).update({ owner: el.value, ...stamp() })); return; }
    if (el.dataset.todoDone) { const on = el.checked; await write(() => db.doc('todos/' + el.dataset.todoDone).update(on ? { done: true, doneAt: new Date().toISOString(), doneBy: S.me || null, ...stamp() } : { done: false, doneAt: null, doneBy: null, ...stamp() })); return; }
    if (el.dataset.todoText) { const v = el.value.trim(); if (v) await write(() => db.doc('todos/' + el.dataset.todoText).update({ text: v, ...stamp() })); return; }
    if (el.id === 'noteTeam' || el.id === 'notePin') { if (!S.noteId) return; await write(() => db.doc('notes/' + S.noteId).update(el.id === 'noteTeam' ? { team: el.value, ...stamp() } : { pinned: el.checked, ...stamp() })); return; }
    if (el.id === 'nsA' || el.id === 'nsB') { const v = el.value.replace(/^\/?robot/i, '').trim(); const cur = byId(S.settings, 'ns'); const patch = { [el.id === 'nsA' ? 'A' : 'B']: v, ...stamp() }; await write(() => cur ? db.doc('settings/ns').update(patch) : db.doc('settings/ns').set({ A: '', B: '', ...patch }), '로봇 번호를 저장했습니다.'); return; }
    if (el.dataset.link) { const [id, f] = el.dataset.link.split('|'); await write(() => db.doc('interfaces/' + id).update({ [f]: el.value, ...stamp() })); return; }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'fAttempt') { S.filterAttempt = e.target.value; render(true); }
    if (e.target.id === 'fLog') { S.filterLog = e.target.value; render(true); }
    if (e.target.id === 'fCode') { S.codeTask = e.target.value; render(true); }
  });
  let qTimer; document.addEventListener('input', e => { if (e.target.id === 'cmdQ') { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { S.cmdQuery = v; render(true); const i = $('#cmdQ'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); return; } if (e.target.id === 'codeQ') { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { S.codeQuery = v; render(true); const i = $('#codeQ'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); return; } if (e.target.id === 'logQ') { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { S.logQuery = v; render(true); const i = $('#logQ'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = document.querySelector('.modal'); if (m) m.parentElement.remove(); else if (view() === 'task') location.hash = lastView; } });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'todoForm') return; e.preventDefault();
    const txt = $('#todoText').value.trim(); if (!txt) { $('#todoText').focus(); return; }
    const t = view() === 'task' ? location.hash.slice(6) : null;
    const ok = await write(() => db.collection('todos').add({ text: txt, team: $('#todoTeam').value, who: $('#todoWho').value.trim(), due: $('#todoDue').value || '', taskId: t, done: false, author: S.me || null, createdAt: new Date().toISOString(), ...stamp() }));
    if (ok) { render(true); const i = $('#todoText'); if (i) { i.value = ''; i.focus(); } }
  });
  let noteTimer = null, noteDirty = null;
  async function flushNote() {
    clearTimeout(noteTimer);
    if (!noteDirty) return; const { id, patch } = noteDirty; noteDirty = null;
    const st = $('#saveState'); if (st) st.textContent = '저장 중…';
    const ok = await write(() => db.doc('notes/' + id).update({ ...patch, ...stamp() }));
    const st2 = $('#saveState'); if (st2) st2.textContent = ok ? '저장됨' : '저장하지 못했습니다';
  }
  document.addEventListener('input', e => {
    if (e.target.id !== 'noteBody' && e.target.id !== 'noteTitle') return;
    if (!S.noteId || S.readOnly || !db) return;
    noteDirty = { id: S.noteId, patch: { ...(noteDirty && noteDirty.id === S.noteId ? noteDirty.patch : {}), [e.target.id === 'noteBody' ? 'body' : 'title']: e.target.id === 'noteBody' ? e.target.value.slice(0, 60000) : e.target.value } };
    const st = $('#saveState'); if (st) st.textContent = '입력 중…';
    clearTimeout(noteTimer); noteTimer = setTimeout(flushNote, 900);
  });
  document.addEventListener('focusout', e => { if (e.target.id === 'noteBody' || e.target.id === 'noteTitle') flushNote(); });
  window.addEventListener('pagehide', () => { flushNote(); });
  window.addEventListener('hashchange', () => { const v = view(); if (v !== 'task') lastView = v; render(true); sharePresence(); });

  // ---------- who is here (live presence) ----------
  const VIEW_NAMES = { overview: '현황', schedule: '일정', notes: '할 일·노트', links: 'A·B 연동', refs: '참고 코드', code: '사용 코드', cmds: '명령어', attempts: '시도 기록', logs: '실행 로그', deck: '발표 자료' };
  function sharePresence() {
    if (!room) return;
    const v = view(), t = v === 'task' ? byId(S.tasks, location.hash.slice(6)) : null;
    room.presence({ team: S.team, where: t ? '작업: ' + t.title.slice(0, 30) : VIEW_NAMES[v] || '' }).catch(() => {});
  }
  async function renderPeople(peers) {
    const box = $('#people'); if (!box) return;
    const ids = [...new Set(peers.map(p => p.by).filter(Boolean))].filter(id => !(id in S.names));
    if (ids.length && user) { try { const ps = await user.profiles(ids); ids.forEach(id => { S.names[id] = (ps[id] && ps[id].name) || '팀원'; }); } catch (e) {} }
    const seen = new Map(); peers.forEach(p => { if (p.kind === 'viewer' && !seen.has(p.by || p.peer)) seen.set(p.by || p.peer, p); });
    const list = [...seen.values()];
    const live = db ? `<span class="live ${S.loaded.tasks ? 'on' : ''}"><i></i>${S.loaded.tasks ? '실시간 동기화 중' : '연결 중'}</span>` : '';
    box.innerHTML = live + (list.length ? ` · 지금 접속: ${list.map(p => { const tm = p.presence && p.presence.team; const col = tm === 'B' ? '#3b6fd8' : tm === 'A' ? '#2f8a5a' : 'var(--muted)'; return `<span class="p"><i style="background:${col}"></i>${esc(p.isMe ? '나' : (S.names[p.by] || '팀원'))}<span class="muted">${esc((p.presence && p.presence.where) || '')}</span></span>`; }).join('')}` : '');
  }

  // ---------- boot ----------
  if (view() !== 'task') lastView = view();
  render();
  (async () => {
    [db, user, assets, downloads, room] = await Promise.all(['db', 'user', 'assets', 'downloads', 'room'].map(n => window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null)));
    S.dbChecked = true;
    if (!db) { render(); return; }
    if (user) {
      try { S.me = await user.id(); } catch (e) {}
      try { const c = await user.can('data.write'); if (c === false) S.readOnly = true; } catch (e) {}
    }
    const timer = setTimeout(() => { S.timedOut = true; render(); }, 10000);
    let rq = null; const schedule = () => { if (rq) return; rq = requestAnimationFrame(() => { rq = null; render(); resolveNames(); }); };
    if (room) { sharePresence(); room.onPeers(ch => renderPeople(ch.peers), () => {}); }
    COLLS.forEach(name => {
      db.collection(name).onSnapshot(snap => {
        S[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!snap.metadata.fromCache) S.loaded[name] = true;
        if (COLLS.every(k => S.loaded[k])) { clearTimeout(timer); S.timedOut = false; }
        if (room) renderPeople(room.peers());
        schedule();
      }, err => { S.loaded[name] = true; clearTimeout(timer); if (err && err.code === 'revoked') { db = null; } schedule(); });
    });
  })();
})();
</script>
